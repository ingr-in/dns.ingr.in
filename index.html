<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section Loader</title>
</head>

<body>

<div id="bittu"></div>

<script>
const kittu = document.getElementById('bittu');

async function loadSection(section) {
    try {
        const file = `/pages/${encodeURIComponent(section)}.html`;

        const res = await fetch(file);

        if (!res.ok) {
            throw new Error("404");
        }

        const html = await res.text();

        kittu.innerHTML = html;

    } catch (err) {

        kittu.innerHTML = `
            <div class="SlE">
                <h2>Sorry</h2>
                <p>${section} temporarily unavailable</p>
            </div>
        `;
    }
}

</script>

</body>
	</html>
